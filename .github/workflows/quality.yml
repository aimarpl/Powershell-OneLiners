name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

  code-characters:
    name: Copy-paste safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for smart quotes and dashes in examples
        run: python3 tools/check-code-characters.py .

  # The examples must be valid under both runtimes, so the analyzer runs twice.
  # These are separate jobs rather than a matrix because the `shell` key does
  # not accept expressions.
  analyze-windows-powershell:
    name: PSScriptAnalyzer (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze examples embedded in Markdown
        shell: powershell
        run: ./tools/Invoke-MarkdownScriptAnalyzer.ps1

  analyze-powershell-7:
    name: PSScriptAnalyzer (PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze examples embedded in Markdown
        shell: pwsh
        run: ./tools/Invoke-MarkdownScriptAnalyzer.ps1
